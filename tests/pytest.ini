[pytest]
# This config lives in tests/. Run via `tests/run_tests.sh`, or explicitly with
# `pytest -c tests/pytest.ini` from the repo root. testpaths are relative to the
# rootdir (tests/ when this file is the config).
testpaths = unit e2e
markers =
    unit: fast, isolated unit tests on pure functions (default)
    e2e: slow end-to-end pipeline run via Nextflow (opt-in with `-m e2e`)
    slow: marks a test as slow-running
# Default run = unit only. Run the E2E smoke test explicitly with `pytest -m e2e`.
addopts = -m "not e2e" -ra
